[package]
name = "music-clustering"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Standalone spherical clustering benchmark for the music recommender"
license = "MIT"

[lib]
name = "music_clustering"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cluster-bench"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "rayon"]
cli = [
  "dep:anyhow",
  "dep:clap",
  "dep:postgres",
  "dep:postgres-protocol",
  "dep:rand-09",
  "dep:tokio-postgres",
  "dep:serde_json",
]
rayon = ["dep:rayon", "dep:rayon-core"]

[dependencies]
anyhow = { version = "1.0", optional = true }
clap = { version = "=4.5.44", features = ["derive"], optional = true }
postgres = { version = "=0.19.10", optional = true }
# Pin the native client dependency chain for the repository's Rust 1.78 toolchain.
postgres-protocol = { version = "=0.6.8", optional = true }
tokio-postgres = { version = "=0.7.13", optional = true }
rand-09 = { package = "rand", version = "=0.9.2", optional = true }
rand = "0.8"
rand_chacha = "0.3"
rayon = { version = "=1.10.0", optional = true }
rayon-core = { version = "=1.12.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
