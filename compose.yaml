
services:
  web:
    build: ./web
    env_file: .env
    restart: unless-stopped
    ports:
      - "4932:3000"
    environment:
      PORT: "3000"
    labels:
      - "traefik.enable=true"
      # set host in DOMAIN env variable
      - "traefik.http.routers.recommender.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.recommender.loadbalancer.server.port=3000"
    networks:
      - traefik_web
      - music
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/api/status'); if (!r.ok) throw new Error('status ' + r.status)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  sync-favorites:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    networks:
      - music
    entrypoint: >
      sh -c "while true; do
        echo \"[sync-favorites] $$(date): syncing...\";
        curl -sf -X POST http://web:3000/api/sync-favorites && echo ok || echo failed;
        sleep 3600;
      done"

  # Periodic analyzer: index new tracks + assign them to frozen clusters.
  # Existing cluster_ids are never touched (see src/clustering.ts).
  analyzer:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    networks:
      - music
    entrypoint: >
      sh -c "while true; do
        echo \"[analyzer] $$(date): analyzing...\";
        curl -sf -X POST http://web:3000/api/analyze && echo ok || echo failed;
        sleep 21600;
      done"

  # Periodic audio embedding generation (OpenL3, CPU). Idempotent: only
  # processes tracks with embedding IS NULL. First run has a backlog
  # (~6k tracks) and will take a while; tune/disable via sleep interval.
  embeddings-loop:
    build:
      context: embeddings
    env_file: .env
    restart: unless-stopped
    volumes:
      - music:/music:ro
    networks:
      - music
    entrypoint: >
      sh -c "while true; do
        echo \"[embeddings-loop] $$(date): generating...\";
        python generate-local-embeddings.py || echo failed;
        sleep 43200;
      done"

  # Standalone Rust cluster job. Benchmark mode is read-only; an apply requires
  # an explicit run id, artifact, and confirmation flag.
  clusterer:
    build:
      context: .
      dockerfile: clusterer/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    profiles: ["clustering"]
    restart: "no"
    init: true
    volumes:
      - cluster-artifacts:/artifacts
    networks:
      - music

  # Bun + WASM numerical engine. Native clusterer remains the apply/rollback
  # boundary; this service only computes and optionally records artifacts.
  clusterer-bun:
    build:
      context: .
      dockerfile: clusterer-bun/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    profiles: ["clustering"]
    restart: "no"
    init: true
    mem_limit: 1g
    volumes:
      - cluster-artifacts:/artifacts
    networks:
      - music

  # Rust OpenL3 embedding worker. Kept behind an explicit profile while the
  # parity gate is running; the ONNX artifact is mounted read-only from
  # embedding-rs/models and is not baked into the image.
  embedding-rust:
    build:
      context: .
      dockerfile: embedding-rs/Dockerfile
    env_file: .env
    profiles: ["embedding-rust"]
    restart: "no"
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUDIO_DIR: /music
    volumes:
      - music:/music:ro
      - ./embedding-rs/models:/models:ro
      - embedding-artifacts:/artifacts
    networks:
      - music

  # index-library:
  #   image: curlimages/curl:latest
  #   restart: unless-stopped
  #   depends_on:
  #     web:
  #       condition: service_healthy
  #   networks:
  #     - music
  #   entrypoint: >
  #     sh -c "while true; do
  #       echo \"[index-library] $$(date): indexing...\";
  #       curl -sf -X POST http://web:3000/api/index-library && echo ok || echo failed;
  #       sleep 86400;
  #     done"

  embeddings:
    build:
      context: embeddings
    env_file: .env
    command: python generate-local-embeddings.py
    init: true
    restart: "no"
    environment:
      AUDIO_DIR: /music
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
      EMBEDDING_DURATION_SECONDS: "${EMBEDDING_DURATION_SECONDS:-60}"
      EMBEDDING_AUDIO_BACKEND: "${EMBEDDING_AUDIO_BACKEND:-fast}"
      EMBEDDING_JOB_NAME: "${EMBEDDING_JOB_NAME:-python-local-embeddings}"
      EMBEDDING_LOCK_KEY: "${EMBEDDING_LOCK_KEY:-5572451585022050817}"
      EMBEDDING_TF_INTRA_THREADS: "${EMBEDDING_TF_INTRA_THREADS:-0}"
      EMBEDDING_TF_INTER_THREADS: "${EMBEDDING_TF_INTER_THREADS:-0}"
      EMBEDDING_DB_RETRIES: "${EMBEDDING_DB_RETRIES:-3}"
      EMBEDDING_DB_RETRY_DELAY: "${EMBEDDING_DB_RETRY_DELAY:-1.0}"
    volumes:
      - music:/music:ro
    profiles:
      - embedding

  # indexer:
  #   build:
  #     context: embeddings
  #   env_file: .env
  #   command: python index-library.py
  #   profiles:
  #     - embedding

networks:
  traefik_web:
    external: true
  music:

volumes:
  music:
    driver: local
    driver_opts:
      type: none
      device: /mnt/zfs/music
      o: bind
  cluster-artifacts:
  embedding-artifacts:
