
# Runs the published images by default. The GHCR prefix must match the GitHub
# repository that release.yml publishes from; override any service with its
# *_IMAGE variable, or build locally with -f compose.yaml -f compose.build.yaml.
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${WEB_IMAGE:-ghcr.io/poesterlin/sole-web:latest}
    env_file: ${APP_ENV_FILE:-.env}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_INTERNAL_URL:-${DATABASE_URL}}"
      MUSIC_LIBRARY_PATH: /music
      WORKER_TOKEN: "${WORKER_TOKEN:-}"
      PLAYBACK_API_KEY: "${PLAYBACK_API_KEY:-}"
      # Behind a domain, SvelteKit compares the browser Origin with this. The
      # Traefik host is the default; set ORIGIN to override it explicitly.
      ORIGIN: "${ORIGIN:-https://${DOMAIN}}"
    labels:
      - "traefik.enable=true"
      # set host in DOMAIN env variable
      - "traefik.http.routers.sole.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.sole.loadbalancer.server.port=3000"
    networks:
      - traefik_web
      - music
    volumes:
      - music:/music:ro
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/api/health'); if (!r.ok) throw new Error('status ' + r.status)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Periodic audio embedding generation (OpenL3, CPU). Idempotent: only
  # processes tracks with embedding IS NULL. First run has a backlog
  # (~6k tracks) and will take a while; tune/disable via sleep interval.
  embeddings-loop:
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/poesterlin/sole-embeddings:latest}
    build:
      context: embeddings
    env_file: ${APP_ENV_FILE:-.env}
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_INTERNAL_URL:-${DATABASE_URL}}"
      # How finely each track is sampled: low | medium | high. See .env.example.
      EMBEDDING_MODE: "${EMBEDDING_MODE:-low}"
    volumes:
      - music:/music:ro
    networks:
      - music
    entrypoint: >
      sh -c "while true; do
        echo \"[embeddings-loop] $$(date): generating...\";
        python generate-local-embeddings.py || echo failed;
        python migrate-centered-embeddings.py || echo centering-failed;
        sleep 43200;
      done"

  # Standalone Rust cluster job. Benchmark mode is read-only; an apply requires
  # an explicit run id, artifact, and confirmation flag.
  clusterer:
    image: ${CLUSTERER_IMAGE:-ghcr.io/poesterlin/sole-clusterer:latest}
    build:
      context: .
      dockerfile: clusterer/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_INTERNAL_URL:-${DATABASE_URL}}"
    profiles: ["clustering"]
    restart: "no"
    init: true
    volumes:
      - cluster-artifacts:/artifacts
    networks:
      - music

  # Bun + WASM numerical engine. Native clusterer remains the apply/rollback
  # boundary; this service only computes and optionally records artifacts.
  clusterer-bun:
    image: ${CLUSTERER_BUN_IMAGE:-ghcr.io/poesterlin/sole-clusterer-bun:latest}
    build:
      context: .
      dockerfile: clusterer-bun/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_INTERNAL_URL:-${DATABASE_URL}}"
    profiles: ["clustering"]
    restart: "no"
    init: true
    mem_limit: 1g
    volumes:
      - cluster-artifacts:/artifacts
    networks:
      - music

  # Rust OpenL3 embedding worker. Kept behind an explicit profile while the
  # parity gate is running; the ONNX artifact is mounted read-only from
  # embedding-rs/models and is not baked into the image.
  embedding-rust:
    image: ${EMBEDDING_RUST_IMAGE:-ghcr.io/poesterlin/sole-embedding-rs:latest}
    build:
      context: .
      dockerfile: embedding-rs/Dockerfile
    env_file: ${APP_ENV_FILE:-.env}
    profiles: ["embedding-rust"]
    restart: "no"
    init: true
    environment:
      DATABASE_URL: "${DATABASE_INTERNAL_URL:-${DATABASE_URL}}"
      AUDIO_DIR: /music
    volumes:
      - music:/music:ro
      - ./embedding-rs/models:/models:ro
      - embedding-artifacts:/artifacts
    networks:
      - music

  embeddings:
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/poesterlin/sole-embeddings:latest}
    build:
      context: embeddings
    env_file: ${APP_ENV_FILE:-.env}
    command: python generate-local-embeddings.py
    init: true
    restart: "no"
    environment:
      DATABASE_URL: "${DATABASE_INTERNAL_URL:-${DATABASE_URL}}"
      AUDIO_DIR: /music
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
      EMBEDDING_DURATION_SECONDS: "${EMBEDDING_DURATION_SECONDS:-60}"
      EMBEDDING_AUDIO_BACKEND: "${EMBEDDING_AUDIO_BACKEND:-fast}"
      EMBEDDING_INFER_BATCH_SIZE: "${EMBEDDING_INFER_BATCH_SIZE:-64}"
      # How finely each track is sampled: low | medium | high. See .env.example.
      EMBEDDING_MODE: "${EMBEDDING_MODE:-low}"
      EMBEDDING_JOB_NAME: "${EMBEDDING_JOB_NAME:-python-local-embeddings}"
      EMBEDDING_LOCK_KEY: "${EMBEDDING_LOCK_KEY:-5572451585022050817}"
      EMBEDDING_TF_INTRA_THREADS: "${EMBEDDING_TF_INTRA_THREADS:-0}"
      EMBEDDING_TF_INTER_THREADS: "${EMBEDDING_TF_INTER_THREADS:-0}"
      EMBEDDING_DB_RETRIES: "${EMBEDDING_DB_RETRIES:-3}"
      EMBEDDING_DB_RETRY_DELAY: "${EMBEDDING_DB_RETRY_DELAY:-1.0}"
    volumes:
      - music:/music:ro
    profiles:
      - embedding

  # Portable worker mode. The worker talks only to the authenticated worker
  # API; it does not need PostgreSQL or a music volume.
  worker:
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/poesterlin/sole-embeddings:latest}
    build:
      context: embeddings
    env_file: ${APP_ENV_FILE:-.env}
    profiles: ["worker"]
    command: python worker.py --source-mode api
    depends_on:
      web:
        condition: service_healthy
    environment:
      WORKER_URL: "${WORKER_URL:-http://web:3000}"
      WORKER_TOKEN: "${WORKER_TOKEN:-}"
    restart: unless-stopped
    init: true
    networks:
      - music

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["database"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-sole}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sole} -d ${POSTGRES_DB:-sole}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - music

networks:
  traefik_web:
    external: ${TRAEFIK_EXTERNAL:-true}
    name: ${TRAEFIK_NETWORK:-traefik_web}
  music:

volumes:
  music:
    driver: local
    driver_opts:
      type: none
      device: ${MUSIC_LIBRARY_PATH:-/srv/music}
      o: bind
  postgres-data:
  cluster-artifacts:
  embedding-artifacts:
