
services:
  recommender:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "4932:3000"
    labels:
      - "traefik.enable=true"
      # set host in DOMAIN env variable
      - "traefik.http.routers.recommender.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.recommender.loadbalancer.server.port=3000"
    networks:
      - traefik_web

  embeddings:
    build:
      context: embeddings
    env_file: .env
    command: python generate-local-embeddings.py
    volumes:
      - music:/music:ro
    profiles:
      - embedding

  indexer:
    build:
      context: embeddings
    env_file: .env
    command: python index-library.py
    profiles:
      - embedding

networks:
  traefik_web:
    external: true

volumes:
  music:
    driver: local
    driver_opts:
      type: none
      device: /mnt/zfs/music
      o: bind
