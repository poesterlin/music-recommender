
# Runs the published images by default. The GHCR prefix must match the GitHub
# repository that release.yml publishes from; override any service with its
# *_IMAGE variable, or build locally with -f compose.yaml -f compose.build.yaml.
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${WEB_IMAGE:-ghcr.io/poesterlin/sole-web:latest}
    env_file: ${APP_ENV_FILE:-.env}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_INTERNAL_URL:-${DATABASE_URL}}"
      MUSIC_LIBRARY_PATH: /music
      WORKER_TOKEN: "${WORKER_TOKEN:-}"
      PLAYBACK_API_KEY: "${PLAYBACK_API_KEY:-}"
      # Behind a domain, SvelteKit compares the browser Origin with this. The
      # Traefik host is the default; set ORIGIN to override it explicitly.
      ORIGIN: "${ORIGIN:-https://${DOMAIN}}"
    labels:
      - "traefik.enable=true"
      # set host in DOMAIN env variable
      - "traefik.http.routers.sole.rule=Host(`${DOMAIN}`)"
      - "traefik.http.services.sole.loadbalancer.server.port=3000"
    networks:
      - traefik_web
      - music
    volumes:
      - music:/music:ro
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://127.0.0.1:3000/api/health'); if (!r.ok) throw new Error('status ' + r.status)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # One-shot native Rust clustering: benchmark, split, apply, and rollback.
  clusterer:
    image: ${CLUSTERER_IMAGE:-ghcr.io/poesterlin/sole-clusterer:latest}
    build:
      context: .
      dockerfile: clusterer/Dockerfile
    environment:
      DATABASE_URL: "${DATABASE_INTERNAL_URL:-${DATABASE_URL}}"
    profiles: ["clustering"]
    restart: "no"
    init: true
    volumes:
      - cluster-artifacts:/artifacts
    networks:
      - music

  worker:
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/poesterlin/sole-embeddings:latest}
    build:
      context: embeddings
    env_file: ${APP_ENV_FILE:-.env}
    depends_on:
      web:
        condition: service_healthy
    environment:
      WORKER_URL: "${WORKER_URL:-http://web:3000}"
      WORKER_TOKEN: "${WORKER_TOKEN:-}"
      # How finely each track is sampled: low | medium | high. See .env.example.
      # Must match a space registered in the database; the worker refuses to run
      # otherwise rather than centre vectors against the wrong mean.
      EMBEDDING_MODE: "${EMBEDDING_MODE:-medium}"
    # The worker reports 0 when it drained the backlog and 2 when it stopped
    # with tracks still pending, so the idle interval can follow the work
    # instead of being fixed. Sleeping 12h regardless meant new music waited up
    # to half a day behind an idle library: 1,900 tracks were queued while the
    # loop was asleep with nothing to do.
    command: >
      sh -c "while true; do
        echo \"[worker] $$(date): embedding...\";
        python worker.py --source-mode api;
        rc=$$?;
        if [ \"$$rc\" -eq 0 ]; then
          echo '[worker] backlog drained, backing off to 12h';
          sleep 43200;
        elif [ \"$$rc\" -eq 2 ]; then
          echo '[worker] tracks still pending, continuing in 5m';
          sleep 300;
        else
          echo \"[worker] failed (exit $$rc), retrying in 15m\";
          sleep 900;
        fi
      done"
    restart: unless-stopped
    init: true
    networks:
      - music

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["database"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-sole}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sole} -d ${POSTGRES_DB:-sole}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - music

networks:
  traefik_web:
    external: ${TRAEFIK_EXTERNAL:-true}
    name: ${TRAEFIK_NETWORK:-traefik_web}
  music:

volumes:
  music:
    driver: local
    driver_opts:
      type: none
      device: ${MUSIC_LIBRARY_PATH:-/srv/music}
      o: bind
  postgres-data:
  cluster-artifacts:
