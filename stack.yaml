# Minimal first-run stack: published images only, no clone required.
#
# The setup script writes this next to a .env and starts it. It is deliberately
# small: PostgreSQL, the app, and an optional API-mode worker. Maintenance jobs
# run inside the app on a timer, so nothing here schedules them. The repository's
# compose.yaml adds the embedding loop, the clustering profiles, and the Traefik
# labels for a public deployment.
#
# To move up to the full stack later, replace this file with the repository's
# compose.yaml and run `docker compose --profile database up -d`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sole
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sole -d sole']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    image: ${WEB_IMAGE:-ghcr.io/poesterlin/sole-web:v0.1.1}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: '3000'
      NODE_ENV: production
      MUSIC_LIBRARY_PATH: /music
      DATABASE_URL: postgres://sole:${POSTGRES_PASSWORD}@postgres:5432/sole
      # SvelteKit rejects a login whose Origin does not match the app's own
      # host. Set ORIGIN in .env when serving through a domain or proxy.
      ORIGIN: ${ORIGIN:-http://127.0.0.1:${WEB_PORT:-3000}}
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Read-only: the app slices the snippets a worker downloads. No worker
      # ever reads these files.
      - music:/music:ro
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://127.0.0.1:3000/api/health'); if (!r.ok) throw new Error('status ' + r.status)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # The embedding worker. API mode needs no music volume and no database — it
  # downloads bounded snippets from the app and uploads vectors back, so it can
  # just as easily run on another host or in a notebook.
  #
  # It sleeps between passes rather than exiting: `worker.py` returns after one
  # pass, so a `restart: unless-stopped` one-shot would re-run in a tight loop.
  #
  # The idle interval follows the backlog. `worker.py` exits 0 when it drained
  # and 2 when it stopped with tracks still pending, so a fixed 12h sleep made
  # new music wait behind an idle library — 1,900 tracks queued while the loop
  # was asleep with nothing to do. Pending resumes in 5m, drained backs off to
  # 12h, and a failure retries in 15m rather than hiding for 12h.
  worker:
    profiles: ['embedding']
    image: ${EMBEDDINGS_IMAGE:-ghcr.io/poesterlin/sole-embeddings:v0.1.1}
    entrypoint: >
      sh -c "while true; do
        echo \"[worker] $$(date): embedding...\";
        python worker.py --source-mode api;
        rc=$$?;
        if [ \"$$rc\" -eq 0 ]; then
          sleep 43200;
        elif [ \"$$rc\" -eq 2 ]; then
          echo '[worker] tracks still pending, continuing in 5m';
          sleep 300;
        else
          echo \"[worker] failed (exit $$rc), retrying in 15m\";
          sleep 900;
        fi
      done"
    restart: unless-stopped
    init: true
    depends_on:
      web:
        condition: service_healthy
    environment:
      WORKER_URL: 'http://web:3000'
      WORKER_TOKEN: '${WORKER_TOKEN:-}'
      EMBEDDING_MODE: '${EMBEDDING_MODE:-medium}'

volumes:
  postgres-data:
  music:
    driver: local
    driver_opts:
      type: none
      device: ${MUSIC_LIBRARY_PATH:-/srv/music}
      o: bind
