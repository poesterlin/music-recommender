name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      # VitePress emits root-absolute asset and link URLs unless told otherwise,
      # and GitHub serves a project site from /<repo>/, so without this every
      # asset 404s. A repository named <owner>.github.io is served from the root.
      #
      # Both halves come from GITHUB_REPOSITORY ("owner/repo"), a core variable
      # set in every run. The expression spellings are not safe here:
      # `github.event.repository_name` is empty on a push, and
      # `github.repository_name` is empty on this Actions instance too, which is
      # what produced a base of "//" and a site whose assets pointed at a host
      # called "assets".
      - name: Resolve the Pages base path
        id: base
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_REPOSITORY:-}" ] || [ "${GITHUB_REPOSITORY#*/}" = "$GITHUB_REPOSITORY" ]; then
            echo "::error::GITHUB_REPOSITORY is not in owner/repo form: '${GITHUB_REPOSITORY:-}'"
            exit 1
          fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            base="/"
          else
            base="/$REPO/"
          fi
          echo "value=$base" >> "$GITHUB_OUTPUT"
          echo "resolved base path: $base"

      - name: Build the site
        env:
          DOCS_BASE: ${{ steps.base.outputs.value }}
        run: bun run build

      # The failure mode is a site that renders but is entirely unstyled, so it
      # is worth catching here rather than in a browser. The expected prefix is
      # recomputed from the repo name rather than read back from the previous
      # step, and the degenerate cases are rejected outright. An earlier version
      # grepped for whatever base it had just computed, so a base of "//"
      # "passed" and the breakage it existed to catch was published anyway.
      # The failure mode is a site that renders but is entirely unstyled, so it
      # is worth catching here rather than in a browser. Each branch asserts both
      # what the output must contain and what it must not: an earlier version
      # only checked the required prefix, so on a user site -- where the prefix is
      # "/" -- it asserted nothing and any base passed, and the forbidden check
      # then rejected the correct root-absolute build.
      - name: Check the built HTML matches the base path
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            expected="/"
          else
            expected="/$REPO/"
          fi
          html=".vitepress/dist/index.html"

          # "//" is protocol-relative, not a path, and would point at a host.
          if grep -qE '(src|href)="//' "$html"; then
            echo "::error::built HTML contains protocol-relative URLs"
            exit 1
          fi

          if [ "$expected" = "/" ]; then
            grep -q 'src="/assets/' "$html" \
              || { echo "::error::expected root-absolute assets for a user site"; exit 1; }
            if grep -qE '(src|href)="/[^"]+/assets/' "$html"; then
              echo "::error::assets carry a repository prefix on a user site"
              exit 1
            fi
          else
            grep -q "src=\"${expected}assets/" "$html" \
              || { echo "::error::assets are not prefixed with ${expected}"; exit 1; }
            if grep -qE '(src|href)="/(assets|logo\.png)' "$html"; then
              echo "::error::built HTML contains unprefixed asset URLs"
              exit 1
            fi
          fi
          echo "base path $expected verified in $html"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
