name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2
  RUST_VERSION: 1.78.0

jobs:
  assets:
    name: Generated images
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Check the committed images match their master
        run: bun run check
      - name: Check the knockout master still derives reproducibly
        run: |
          python3 -m pip install --quiet Pillow
          python3 make-alpha.py
          git diff --exit-code -- source/logo-mark-alpha.png

  web:
    name: Web checks and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Verify compiled API routing
        run: bun scripts/smoke-api.ts

  rust:
    name: Rust tests and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clustering-rs
      - name: Check Rust formatting
        run: cargo fmt --manifest-path clustering-rs/Cargo.toml --all -- --check
      - name: Test native clustering
        run: cargo test --manifest-path clustering-rs/Cargo.toml --locked
      - name: Lint native clustering
        run: cargo clippy --manifest-path clustering-rs/Cargo.toml --locked --all-targets -- -D warnings

  python:
    name: Python worker tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned worker image
        run: docker build --tag sole-embeddings:ci embeddings
      - name: Run worker unit tests
        run: |
          docker run --rm \
            --volume "$PWD/embeddings:/workspace-tests:ro" \
            --entrypoint python \
            sole-embeddings:ci \
            -m unittest discover -s /workspace-tests/tests

  fresh-db:
    name: Fresh database migration smoke test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sole
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sole
        run: bun run db:migrate
      - name: Verify first embeddings and trigger-derived centering
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sole
          FRESH_DATABASE: '1'
        run: bun run test:fresh-db
      - name: Run machine-readable preflight
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sole
          DOMAIN: sole.example.test
          MUSIC_HOST: http://music-assistant.example.test
          MA_TOKEN: ci-token
          WORKER_TOKEN: ci-worker-token
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/sole
          DOMAIN=sole.example.test
          MUSIC_HOST=http://music-assistant.example.test
          MA_TOKEN=ci-token
          WORKER_TOKEN=ci-worker-token
          EOF
          bun run doctor -- --json --skip-audio > fresh-doctor.json
          node -e "const r=require('./fresh-doctor.json'); if (!r.ok) process.exit(1)"

  docker:
    name: Docker Compose builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare example environment
        run: cp .env.example .env
      - name: Validate Compose profiles
        run: docker compose --profile database --profile clustering config --quiet
      - name: Build release services
        run: docker compose --profile clustering build
