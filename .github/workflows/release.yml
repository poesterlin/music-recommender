name: Release images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: embeddings
            context: ./embeddings
            dockerfile: ./embeddings/Dockerfile
          - name: clusterer
            context: .
            dockerfile: ./clusterer/Dockerfile
          - name: clusterer-bun
            context: .
            dockerfile: ./clusterer-bun/Dockerfile
          - name: embedding-rs
            context: .
            dockerfile: ./embedding-rs/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image names
        id: image
        shell: bash
        run: |
          repository="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.prefix }}-${{ matrix.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.prefix }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  github-release:
    name: Create GitHub release
    needs: images
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
