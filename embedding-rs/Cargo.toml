[package]
name = "music-embedding"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Pure-Rust OpenL3-compatible audio embedding worker"
license = "MIT"

[lib]
name = "music_embedding"
path = "src/lib.rs"

[[bin]]
name = "embedding-worker"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:postgres", "dep:postgres-protocol"]
ffmpeg-fallback = []
libsndfile-decoder = ["dep:sndfile-sys"]
onnxruntime = [
  "dep:ort",
  "dep:ort-sys",
  "dep:ureq",
  "dep:url",
  "dep:idna",
  "dep:zeroize",
  "dep:litemap",
]
soxr-resampler = ["dep:soxr"]
production = [
  "cli",
  "ffmpeg-fallback",
  "libsndfile-decoder",
  "onnxruntime",
  "soxr-resampler",
]

[dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.44", features = ["derive"], optional = true }
encoding_rs = "=0.8.33"
kstring = "=2.0.2"
pest = "=2.7.15"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
unicode-segmentation = "=1.12.0"
ndarray = "=0.16.1"
# ort rc.9 is the newest ONNX Runtime binding release compatible with Rust 1.78.
# Keep the exact sys pin: its broad prerelease range otherwise selects rc.13,
# whose Edition 2024 manifest cannot be parsed by Cargo 1.78.
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["download-binaries"], optional = true }
ort-sys = { version = "=2.0.0-rc.9", optional = true }
postgres = { version = "=0.19.10", optional = true }
postgres-protocol = { version = "=0.6.8", optional = true }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
sndfile-sys = { version = "=0.2.2", optional = true }
# These exact constraints keep ort-sys' download/TLS graph on releases whose
# manifests still build with the crate's Rust 1.78 toolchain.
idna = { version = "=1.0.2", optional = true }
litemap = { version = "=0.7.4", optional = true }
rustfft = "=6.4.1"
soxr = { version = "=0.6.0", optional = true }
symphonia = { version = "=0.5.5", features = ["all"] }
tract-onnx = "=0.21.18"
tract-linalg = { version = "=0.21.18", features = ["multithread-mm"] }
ureq = { version = "=2.10.1", default-features = false, features = ["tls"], optional = true }
url = { version = "=2.5.2", optional = true }
zeroize = { version = "=1.8.1", optional = true }

[dev-dependencies]
tempfile = "=3.20.0"
